spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/board_test?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=HardRain77

#mybatis
#mapper
mybatis.mapper-locations=classpath:mappers/*.xml

#type as
mybatis.type-aliases-package=com.codeboy.mvc.model.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 채팅 모델 (나중에 문제 생성/검증에 사용)
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.response-mime-type=application/json

# 임베딩 모델 (RAG용)
spring.ai.openai.embedding.options.model=text-embedding-3-large

debug=true